{% extends "base.html" %}
{% block title %}Admin login | {{ EVENT.name }}{% endblock %}
{% block content %}
<section class="card narrow up">
  <h2>Admin login</h2>
  <p class="muted">Enter the admin password to view the waitlist.</p>
  {% if not configured %}
  <div class="flash error">ADMIN_PASSWORD is not set. Add it to your environment variables first.</div>
  {% endif %}
  <form method="post" novalidate>
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Password <input type="password" name="password" required autofocus autocomplete="current-password"></label>
    <button class="btn" type="submit">Log in</button>
  </form>
</section>
{% endblock %}
